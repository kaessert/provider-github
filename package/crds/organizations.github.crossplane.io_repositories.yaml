                                  items:
                                    type: string
                                  type: array
                                teams:
                                  description: The list of team slugs with dismissal
                                    access.
                                  items:
                                    type: string
                                  type: array
                                users:
                                  description: The list of user logins with dismissal
                                    access.
                                  items:
                                    type: string
                                  type: array
                              type: object
                            requireCodeOwnerReviews:
                              description: Blocks merging pull requests until code
