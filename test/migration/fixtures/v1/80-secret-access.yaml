# Access to organization secrets the setup step creates through the GitHub API
# (the provider never creates a secret). Both secrets have visibility
# `selected`, so the repository list is what the provider manages.
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: ActionsSecretAccess
metadata:
  name: pgh-mig-actions-secret-access
  annotations:
    crossplane.io/external-name: PGH_MIG_ACTIONS_SECRET
spec:
  forProvider:
    org: __ORG__
    visibility: selected
    selectedRepositories:
      - repo: pgh-mig-repo-main
  providerConfigRef:
    name: default
---
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: DependabotSecretAccess
metadata:
  name: pgh-mig-dependabot-secret-access
  annotations:
    crossplane.io/external-name: PGH_MIG_DEPENDABOT_SECRET
spec:
  forProvider:
    org: __ORG__
    visibility: selected
    selectedRepositories:
      - repo: pgh-mig-repo-main
  providerConfigRef:
    name: default
