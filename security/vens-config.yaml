# vens configuration — contextual risk scoring for supply chain security
#
# This file describes the provider's deployment context so vens can score
# CVEs using OWASP Risk Rating instead of just generic CVSS.
#
# Customize the values below for your provider. See:
# https://venslabs.github.io/vens/guides/configuration/

project:
  name: "provider-github"
  description: "Crossplane provider managing GitHub organization, team, repository and webhook resources through the GitHub REST API"

context:
  # Where does this software run?
  # internal = private network only
  # private  = VPN / authenticated access
  # internet = publicly reachable
  #
  # The controller calls the GitHub REST API as a GitHub App installation,
  # using an app ID, installation ID and RSA private key read from a
  # Kubernetes Secret -- authenticated access to organizations and
  # repositories that are not otherwise exposed by this provider.
  exposure: "private"

  # What kind of data does it handle?
  # low      = public data
  # medium   = internal business data
  # high     = PII, credentials, financial data
  # critical = classified, regulated (HIPAA, PCI-DSS)
  #
  # The GitHub App private key passes through this provider's reconcile loop,
  # and it manages organization membership, teams, repositories, webhooks and
  # the repositories that may read organization secrets.
  data_sensitivity: "high"

  # How important is this to the business?
  # low      = nice to have
  # medium   = supports business operations
  # high     = core infrastructure
  # critical = revenue-critical, SLA-bound
  business_criticality: "high"

  # Compliance frameworks that apply
  compliance_requirements:
    - "SOC2"
    # - "GDPR"
    # - "HIPAA"
    # - "PCI-DSS"
    # - "FedRAMP"

  # Security controls already in place
  controls:
    waf: false
    network_segmentation: true    # k8s namespace isolation
    # mfa: true
    # encryption_at_rest: true
