apiVersion: v1
kind: Secret
metadata:
  name: pgh-e2e-webhook-secret
  namespace: crossplane-system
type: Opaque
stringData:
  # Disposable value used only for this example, never a real credential.
  secret: pgh-e2e-webhook-signing-value
---
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: OrganizationWebhook
metadata:
  name: pgh-e2e-webhook
spec:
  forProvider:
    org: pgh-test
    # An existing organization webhook with this URL is adopted, so every
    # example uses its own URL.
    url: https://example.com/pgh-e2e
    contentType: json
    insecureSsl: false
    active: true
    events:
      - repository
    secretKeyRef:
      name: pgh-e2e-webhook-secret
      namespace: crossplane-system
      key: secret
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: pgh-e2e-webhook-conn
    namespace: crossplane-system
