apiVersion: v1
kind: Secret
metadata:
  name: pgh-e2e-webhook-secret-ns
  namespace: default
type: Opaque
stringData:
  # Disposable value used only for this example, never a real credential.
  secret: pgh-e2e-webhook-signing-value-ns
---
apiVersion: organizations.github.m.crossplane.io/v1alpha1
kind: OrganizationWebhook
metadata:
  name: pgh-e2e-webhook-ns
  namespace: default
spec:
  forProvider:
    org: pgh-test
    # An existing organization webhook with this URL is adopted, so every
    # example uses its own URL.
    url: https://example.com/pgh-e2e-ns
    contentType: json
    insecureSsl: false
    active: true
    events:
      - repository
    secretKeyRef:
      name: pgh-e2e-webhook-secret-ns
      namespace: default
      key: secret
  providerConfigRef:
    kind: ProviderConfig
    name: default
  writeConnectionSecretToRef:
    name: pgh-e2e-webhook-conn-ns
