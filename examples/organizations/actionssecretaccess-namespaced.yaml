---
# Repository access for an existing Actions secret, limited to selected repositories.
# The secret must already exist on GitHub with visibility "selected".
apiVersion: organizations.github.m.crossplane.io/v1alpha1
kind: ActionsSecretAccess
metadata:
  name: sample-actions-secret-selected-ns
  namespace: default
  annotations:
    crossplane.io/external-name: SAMPLE_ACTIONS_SECRET_SELECTED-ns
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: example
  forProvider:
    orgRef:
      name: pgh-sample-organization-ns
    visibility: selected
    selectedRepositories:
    - repoRef:
        name: sample-repository-ns
---
# An existing Actions secret available to all private repositories.
apiVersion: organizations.github.m.crossplane.io/v1alpha1
kind: ActionsSecretAccess
metadata:
  name: sample-actions-secret-private-ns
  namespace: default
  annotations:
    crossplane.io/external-name: SAMPLE_ACTIONS_SECRET_PRIVATE-ns
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: example
  forProvider:
    orgRef:
      name: pgh-sample-organization-ns
    visibility: private
