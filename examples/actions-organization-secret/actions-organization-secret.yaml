apiVersion: v1
kind: Secret
metadata:
  name: pgh-e2e-org-secret-value
  namespace: crossplane-system
type: Opaque
stringData:
  # Disposable value used only for this example, never a real credential.
  value: pgh-e2e-org-secret-disposable-value
---
# GitHub accepts only letters, digits and underscores in a secret name, so the
# external name is set explicitly: metadata.name carries dashes and is not a
# valid default. The provider creates the secret and writes the value read from
# valueSecretRef.
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: ActionsOrganizationSecret
metadata:
  name: pgh-e2e-org-secret
  annotations:
    crossplane.io/external-name: PGH_E2E_ORG_SECRET
spec:
  forProvider:
    org: pgh-test
    visibility: selected
    selectedRepositories:
      - repo: demo-repository-1
    valueSecretRef:
      name: pgh-e2e-org-secret-value
      namespace: crossplane-system
      key: value
  providerConfigRef:
    name: default
