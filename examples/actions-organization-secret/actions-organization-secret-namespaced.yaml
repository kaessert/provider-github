apiVersion: v1
kind: Secret
metadata:
  name: pgh-e2e-org-secret-value-ns
  namespace: default
type: Opaque
stringData:
  # Disposable value used only for this example, never a real credential.
  value: pgh-e2e-org-secret-disposable-value-ns
---
# GitHub accepts only letters, digits and underscores in a secret name, so the
# external name is set explicitly: metadata.name carries dashes and is not a
# valid default. The provider creates the secret and writes the value read from
# valueSecretRef, which is always a Secret in this resource's own namespace.
apiVersion: organizations.github.m.crossplane.io/v1alpha1
kind: ActionsOrganizationSecret
metadata:
  name: pgh-e2e-org-secret-ns
  namespace: default
  annotations:
    crossplane.io/external-name: PGH_E2E_ORG_SECRET_NS
spec:
  forProvider:
    org: pgh-test
    visibility: selected
    selectedRepositories:
      - repo: demo-repository-1
    valueSecretRef:
      name: pgh-e2e-org-secret-value-ns
      namespace: default
      key: value
  providerConfigRef:
    kind: ProviderConfig
    name: default
