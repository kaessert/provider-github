# The secret must already exist: the provider manages which repositories can
# use it and never creates it. The external name is the secret name.
apiVersion: organizations.github.m.crossplane.io/v1alpha1
kind: ActionsSecretAccess
metadata:
  name: pgh-e2e-actions-secret-ns
  namespace: default
  annotations:
    crossplane.io/external-name: PGH_E2E_ACTIONS_SECRET
spec:
  forProvider:
    org: pgh-test
    visibility: selected
    selectedRepositories:
      - repo: demo-repository-1
  providerConfigRef:
    kind: ProviderConfig
    name: default
